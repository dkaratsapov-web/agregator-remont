# Подключается поверх docker-compose.yml на сервере с доменом: Caddy с автоматическим HTTPS
# и входом для тестировщиков на время закрытого теста. Порты 80 и 443 должны быть открыты.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }
    # Проверка здоровья: Caddy отвечает на своём локальном адресе управления (автообновление
    # ждёт healthy у всех сервисов, AUDIT_FINDINGS DEV-10).
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 3s
      retries: 6
    environment:
      DOMAIN: ${DOMAIN:?Задайте DOMAIN в deploy/.env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      web: { condition: service_healthy }

  # Логин и пароль тестировщика проверяет web (страница /gate, apps/web/src/lib/gate.ts);
  # Caddy спрашивает его перед каждым запросом в закрытую часть (forward_auth в Caddyfile).
  web:
    environment:
      # Перед web стоит один прокси (Caddy): IP посетителя берётся из X-Forwarded-For. Без этого
      # все посетители получают один «неизвестный» IP, и 10 неверных паролей от кого угодно
      # блокировали бы вход всем тестировщикам (AUDIT_FINDINGS SEC-2).
      WEB_TRUST_PROXY_HOPS: '1'
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?Задайте BASIC_AUTH_USER в deploy/.env}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?Задайте BASIC_AUTH_HASH в deploy/.env}

volumes:
  caddy-data:
  caddy-config:
