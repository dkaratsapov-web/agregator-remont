# Подключается поверх docker-compose.yml на сервере с доменом: Caddy с автоматическим HTTPS
# и входом для тестировщиков на время закрытого теста. Порты 80 и 443 должны быть открыты.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Задайте DOMAIN в deploy/.env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      web: { condition: service_healthy }

  # Логин и пароль тестировщика проверяет web (страница /gate, apps/web/src/lib/gate.ts);
  # Caddy спрашивает его перед каждым запросом в закрытую часть (forward_auth в Caddyfile).
  web:
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?Задайте BASIC_AUTH_USER в deploy/.env}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?Задайте BASIC_AUTH_HASH в deploy/.env}

volumes:
  caddy-data:
  caddy-config:
