# Полный стек: PostgreSQL, миграции (+ демо-данные), API и web. HTTPS на домене — docker-compose.proxy.yml.
#   Локально:  docker compose -f deploy/docker-compose.yml up -d --build
#   На домене: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.proxy.yml up -d --build
# Подробности: deploy/README.md
name: agregator

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agregator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-agregator}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  # Одноразовый запуск: миграции и (по желанию) демо-заказы. API стартует только после успеха.
  migrate:
    build: { context: .., target: api }
    image: agregator-api:local
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agregator}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agregator}?schema=public
      SEED_DEMO: ${SEED_DEMO:-false}
    command:
      - sh
      - -c
      - ./node_modules/.bin/prisma migrate deploy && if [ "$$SEED_DEMO" = "true" ]; then ALLOW_DEMO_SEED=true ./node_modules/.bin/tsx prisma/seed.ts; fi
    depends_on:
      db: { condition: service_healthy }

  api:
    image: agregator-api:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agregator}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agregator}?schema=public
      API_PORT: '4000'
      # Браузеры к API напрямую не обращаются: web ходит к нему по внутренней сети.
      CORS_ORIGINS: ''
      # API доверяет X-Forwarded-For только от адресов приватной сети Docker (сервер web).
      TRUST_PROXY: uniquelocal
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
      AUTH_RATE_LIMIT_PER_MIN: ${AUTH_RATE_LIMIT_PER_MIN:-10}
      WRITE_RATE_LIMIT_PER_MIN: ${WRITE_RATE_LIMIT_PER_MIN:-30}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: .., target: web }
    image: agregator-web:local
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
      WEB_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      # 1 за Caddy (docker-compose.proxy.yml), 0 при локальном запуске без proxy.
      WEB_TRUST_PROXY_HOPS: ${WEB_TRUST_PROXY_HOPS:-0}
    ports:
      # Только localhost: снаружи сайт доступен через Caddy.
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/offline').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api: { condition: service_healthy }

volumes:
  db-data:
