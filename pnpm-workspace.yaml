  js-yaml@>=5.0.0 <5.4.1: ^5.4.1
  # GHSA-q7qp-rjg7-q26m: @nestjs/platform-express 11.x фиксирует multer 2.4.0 (патч в 2.5.0).
  multer@>=2.0.0 <2.5.0: ^2.5.0
  # GHSA-27r3-jxmh-p828: @nestjs/platform-express -> express -> body-parser 2.3.0 (патч в 2.4.0).
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
