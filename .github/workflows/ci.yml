name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: agregator
          POSTGRES_PASSWORD: agregator
          POSTGRES_DB: agregator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agregator -d agregator_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Только для эфемерной БД в CI, не секрет.
      DATABASE_URL: postgresql://agregator:agregator@localhost:5432/agregator_test?schema=public
      TEST_DATABASE_URL: postgresql://agregator:agregator@localhost:5432/agregator_test?schema=public
      API_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: |
          pnpm --filter @agregator/shared build
          pnpm --filter @agregator/api test:cov
          pnpm --filter @agregator/web test:cov

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            apps/api/coverage/lcov.info
            apps/web/coverage/lcov.info
          if-no-files-found: ignore

      - name: Autodeploy script (shellcheck and scenarios)
        run: |
          shellcheck -x deploy/autodeploy/*.sh deploy/backup/*.sh scripts/autodeploy-test.sh scripts/perf/*.sh
          bash scripts/autodeploy-test.sh

      - name: Build
        run: pnpm build

      # ADR 0001/0003: спецификация и типы генерируются из кода; ручные правки и забытая
      # перегенерация ломают сборку.
      - name: OpenAPI and generated types are up to date
        run: |
          node apps/api/dist/openapi/generate.js
          pnpm --filter @agregator/shared openapi:types
          git diff --exit-code -- apps/api/openapi.json packages/shared/src/generated

      # ARCH-8: schema.prisma и миграции не расходятся (забытая миграция или правка SQL мимо
      # схемы). Частичные индексы Prisma не видит; они перечислены в комментариях schema.prisma.
      - name: Schema matches migrations
        run: |
          PGPASSWORD=agregator psql -h localhost -U agregator -d agregator_test \
            -c 'CREATE DATABASE agregator_shadow'
          pnpm --filter @agregator/api exec prisma migrate diff --exit-code \
            --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://agregator:agregator@localhost:5432/agregator_shadow

      - name: Migrations and seed apply cleanly
        run: |
          pnpm --filter @agregator/api exec prisma migrate deploy
          pnpm --filter @agregator/api exec tsx prisma/seed.ts
          pnpm --filter @agregator/api exec tsx prisma/seed.ts

      - name: Install Chromium for browser checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke and integration tests (production build)
        env:
          NODE_ENV: production
          CORS_ORIGINS: https://remont.example
          # Имитация схемы proxy → web → API: web доверяет одному proxy, API доверяет web (loopback).
          TRUST_PROXY: loopback
          WEB_TRUST_PROXY_HOPS: '1'
          WEB_PUBLIC_ORIGIN: http://localhost:3000
          AUTH_RATE_LIMIT_PER_MIN: '3'
        run: |
          # Логин и пароль тестировщика (страница /gate) проверяет web: хеш тот же, что в deploy/.env.
          export BASIC_AUTH_USER=tester
          export BASIC_AUTH_HASH=$(docker run --rm caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f caddy hash-password --plaintext 'ci-password')
          node apps/api/dist/main.js > api.log 2>&1 &
          echo $! > api.pid
          (cd apps/web && pnpm exec next start --port 3000 > ../../web.log 2>&1 &)
          pnpm smoke
          node scripts/jobs-integration.mjs
          node scripts/bids-integration.mjs
          # Черновики в браузере: автосохранение, продолжение, удаление, публикация.
          node scripts/drafts-e2e.mjs
          # Заказ с несколькими категориями: позиции в форме, страница заказа, каталог.
          node scripts/job-items-e2e.mjs
          # Сценарии MVP из аудита: повтор публикации, две вкладки (заказ и черновик), истёкшая
          # сессия посреди формы, пометка откликов после правки, исход закрытия.
          node scripts/mvp-e2e.mjs
          # Пробелы тестов из аудита: регистрация, обрыв сети при автосохранении, пустой поиск,
          # двойной клик по «Откликнуться» и «Выбрать», выход в другой вкладке.
          node scripts/cabinet-e2e.mjs
          # Доступность из аудита (UX-1…14), замеры LCP/CLS/INP и видео пролёта на главной.
          node scripts/ux-e2e.mjs
          # Главная за настоящим deploy/Caddyfile (http://localhost:8080, подходит для service
          # worker): публичность, отсутствие запросов в закрытую часть, клавиатура, reduced motion,
          # диалог пароля мимо SW и офлайн-страница при остановленном Caddy (scripts/landing-e2e.mjs).
          sed 's#web:3000#localhost:3000#g' deploy/Caddyfile > "$RUNNER_TEMP/Caddyfile"
          docker run -d --name e2e-caddy --network host \
            -e DOMAIN=http://localhost:8080 \
            -v "$RUNNER_TEMP/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
          for i in $(seq 1 30); do curl -fs -o /dev/null http://localhost:8080/ && break; sleep 1; done
          STOP_PROXY_CMD='docker stop e2e-caddy' node scripts/landing-e2e.mjs
          # Последним: в конце останавливает API, чтобы проверить выход при сбое API.
          API_PID=$(cat api.pid) node scripts/auth-integration.mjs

      - name: Server logs on failure
        if: failure()
        run: tail -n 100 api.log web.log || true

  docker:
    name: Docker stack (compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml -f deploy/docker-compose.ci.yml

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Prepare deploy/.env
        run: |
          cp deploy/.env.example deploy/.env
          sed -i "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" deploy/.env
          echo "AUTH_RATE_LIMIT_PER_MIN=20" >> deploy/.env

      # DEBIAN_MIRROR (Dockerfile, стадия base): корректное зеркало подставляется в источники apt,
      # опасные значения отклоняются проверкой до sed, а не падением сети.
      - name: DEBIAN_MIRROR is applied and validated
        run: |
          docker build --target base --build-arg DEBIAN_MIRROR=http://mirror.yandex.ru/ -t mirror-check .
          docker run --rm --entrypoint grep mirror-check -q \
            'URIs: http://mirror.yandex.ru/debian-security' /etc/apt/sources.list.d/debian.sources
          for bad in 'http://x|e id|' 'http://x&y' 'http://user:pw@host' 'https://mirror.yandex.ru' 'ftp://host' 'http://a b'; do
            if docker build --progress=plain --target base --build-arg "DEBIAN_MIRROR=$bad" . > build.log 2>&1; then
              echo "accepted invalid DEBIAN_MIRROR: $bad"; exit 1
            fi
            grep -q 'DEBIAN_MIRROR:' build.log || { echo "failed for another reason: $bad"; tail -20 build.log; exit 1; }
          done

      - name: Build images and start the stack
        run: $COMPOSE up -d --build

      - name: Wait for web
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/offline > /dev/null && exit 0
            sleep 2
          done
          exit 1

      - name: Smoke and integration tests against containers
        env:
          NODE_ENV: production
          API_URL: http://localhost:4000
          WEB_URL: http://localhost:3000
        run: |
          node scripts/smoke.mjs
          node scripts/jobs-integration.mjs
          node scripts/bids-integration.mjs

      - name: Another container in the backend network cannot spoof the client IP
        run: |
          docker run --rm --network agregator_backend agregator-api:local node -e "
            (async () => {
              for (let i = 1; i <= 30; i++) {
                const res = await fetch('http://api:4000/v1/auth/login', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'X-Forwarded-For': '203.0.113.' + i },
                  body: JSON.stringify({ email: 'victim@example.ru', password: 'guess-password-' + i }),
                });
                if (res.status === 429) { console.log('blocked after', i, 'attempts with rotating X-Forwarded-For'); return; }
              }
              console.error('X-Forwarded-For from a non-web container was trusted'); process.exit(1);
            })();"

      - name: Image sizes
        if: always()
        run: docker image ls 'agregator-*'

      - name: Container logs on failure
        if: failure()
        run: $COMPOSE logs --tail 200

      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v

  proxy:
    name: Docker stack behind Caddy (proxy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.proxy.yml

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Prepare deploy/.env for https://localhost (Caddy internal CA)
        run: |
          cp deploy/.env.example deploy/.env
          HASH=$(docker run --rm caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f caddy hash-password --plaintext 'ci-password')
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "DOMAIN=localhost"
            echo "PUBLIC_ORIGIN=https://localhost"
            echo "WEB_TRUST_PROXY_HOPS=1"
            echo "BASIC_AUTH_USER=tester"
            echo "BASIC_AUTH_HASH='$HASH'"
          } >> deploy/.env

      - name: Only Caddy publishes ports; backend network is internal
        run: $COMPOSE config --format json | node scripts/check-deploy-ports.mjs

      - name: Build images and start the stack
        run: $COMPOSE up -d --build

      - name: Wait for Caddy
        run: |
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/jobs) || true
            [ "$code" = "401" ] && exit 0
            sleep 2
          done
          exit 1

      - name: Password, HTTPS and closed web port
        run: |
          set -e
          # Вход тестировщика — своя страница /gate вместо системного окна браузера: форма отдаёт
          # cookie-пропуск, его проверяет web по запросу Caddy (forward_auth).
          gate_login() {
            curl -sk -c "$3" -o /dev/null -w '%{http_code} %{redirect_url}' -X POST \
              -H "Origin: ${4:-https://localhost}" --data-urlencode "login=$1" \
              --data-urlencode "password=$2" --data-urlencode 'next=/jobs' https://localhost/gate/login
          }
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/jobs)" = "401"
          # Открытие страницы в браузере без пропуска — переход на /gate, без WWW-Authenticate.
          test "$(curl -sk -o /dev/null -w '%{http_code} %{redirect_url}' -H 'Sec-Fetch-Mode: navigate' -H 'Accept: text/html' https://localhost/jobs)" = "303 https://localhost/gate?next=%2Fjobs"
          if curl -sk -D - -o /dev/null https://localhost/jobs | grep -qi '^www-authenticate'; then echo 'WWW-Authenticate is sent'; exit 1; fi
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/gate)" = "200"
          curl -sk https://localhost/gate | grep -q 'Вход для тестировщиков'
          test "$(gate_login tester wrong wrong.jar)" = "303 https://localhost/gate?error=wrong&next=%2Fjobs"
          test "$(gate_login nobody ci-password wrong.jar)" = "303 https://localhost/gate?error=wrong&next=%2Fjobs"
          test "$(gate_login tester ci-password evil.jar https://evil.example)" = "303 https://localhost/gate?error=origin&next=%2F"
          test "$(curl -sk -b wrong.jar -o /dev/null -w '%{http_code}' https://localhost/jobs)" = "401"
          test "$(curl -sk -b evil.jar -o /dev/null -w '%{http_code}' https://localhost/jobs)" = "401"
          test "$(gate_login tester ci-password gate.jar)" = "303 https://localhost/jobs"
          grep -q '__Host-ar_gate' gate.jar
          test "$(curl -sk -b gate.jar -o /dev/null -w '%{http_code}' https://localhost/jobs)" = "200"
          curl -sk -D - -o /dev/null -b gate.jar https://localhost/jobs | grep -i '^strict-transport-security: max-age=31536000'
          # Подделанный или чужой пропуск не принимается.
          test "$(curl -sk -H 'Cookie: __Host-ar_gate=v1.9999999999.forged' -o /dev/null -w '%{http_code}' https://localhost/jobs)" = "401"
          test "$(curl -sk -H 'Cookie: __Host-ar_gate=' -o /dev/null -w '%{http_code}' https://localhost/jobs)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/jobs)" = "308"
          if curl -s -o /dev/null --max-time 5 http://127.0.0.1:3000/; then echo 'web port 3000 is reachable on the host'; exit 1; fi
          if curl -s -o /dev/null --max-time 5 http://127.0.0.1:4000/health; then echo 'api port 4000 is reachable on the host'; exit 1; fi
          # Без пароля открыта только главная и её статика; приложение и /_next/image закрыты.
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/)" = "200"
          curl -sk https://localhost/ | grep -q 'Гарантыч'
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/robots.txt)" = "200"
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/offline)" = "200"
          asset=$(curl -sk https://localhost/ | grep -o '/_next/static/[^"]*\.js' | head -n 1)
          test -n "$asset"
          test "$(curl -sk -o /dev/null -w '%{http_code}' "https://localhost$asset")" = "200"
          for path in /login /register /account /account/jobs /jobs/x /_next/image /unknown '/?x=1/../jobs'; do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "https://localhost$path")
            if [ "$path" = '/?x=1/../jobs' ]; then expected=200; else expected=401; fi
            [ "$code" = "$expected" ] || { echo "$path: expected $expected, got $code"; exit 1; }
          done
          # Без пароля разрешено только чтение. Next.js принимает Server Actions POST-запросом на
          # любой адрес, поэтому POST (и прочие методы) на открытые адреса тоже требуют пароль.
          for method in POST PUT PATCH DELETE OPTIONS; do
            for path in / /offline /gate /robots.txt /_next/static/x; do
              code=$(curl -sk -o /dev/null -w '%{http_code}' -X "$method" "https://localhost$path")
              [ "$code" = "401" ] || { echo "$method $path: expected 401, got $code"; exit 1; }
            done
          done
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X POST -H 'Next-Action: 0' https://localhost/)" = "401"
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X POST -b gate.jar https://localhost/)" != "401"
          # Большое тело без Content-Length (chunked) на открытый POST /lead: пока приём выключен,
          # web отвечает 503, не читая тело (лимит чтения 2 КБ проверяет unit-тест route.test.ts).
          head -c 9000000 /dev/zero > big.bin
          code=$(curl -sk -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://localhost' \
            -H 'Content-Type: application/json' -H 'Transfer-Encoding: chunked' \
            --data-binary @big.bin https://localhost/lead)
          [ "$code" = "503" ] || { echo "chunked 9 MB to /lead: expected 503, got $code"; exit 1; }
          # Политика открыта для чтения; единственный открытый POST — заявка (POST /lead). Пока
          # реквизиты оператора не заданы, приём выключен: 503 от web, а не 401 от Caddy.
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/privacy)" = "200"
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://localhost/privacy)" = "401"
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/lead)" = "401"
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X PUT https://localhost/lead)" = "401"
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://localhost/lead/x)" = "401"
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/gate/login)" = "401"
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://localhost/gate/login/x)" = "401"
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/gate/check)" = "401"
          code=$(curl -sk -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://localhost' \
            -H 'Content-Type: application/json' -d '{"name":"Тест","phone":"+79001234567","consent":true}' \
            https://localhost/lead)
          [ "$code" = "503" ] || { echo "POST /lead: expected 503, got $code"; exit 1; }
          code=$(curl -sk -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://evil.example' \
            -H 'Content-Type: application/json' -d '{}' https://localhost/lead)
          [ "$code" = "403" ] || { echo "POST /lead from a foreign origin: expected 403, got $code"; exit 1; }
          # Обход: «..», закодированные точки и слеши, двойное кодирование, регистр, «;», «.».
          # Ни один вариант не отдаёт страницу приложения (маркер — навигация шапки приложения).
          for path in /icons/../jobs /_next/static/../../jobs /_next/static/%2e%2e/%2e%2e/jobs //jobs \
            /%2fjobs '/_next/static%2f..%2f..%2fjobs' /_next/static/%2e%2e%2f%2e%2e%2fjobs /icons%2f..%2fjobs \
            /_next/static/%252e%252e/%252e%252e/jobs /%252e%252e/jobs /Jobs /ACCOUNT /_NEXT/STATIC/../../jobs \
            '/_next/static/..;/..;/jobs' /./jobs /jobs/ '/jobs?_rsc=1' /%6Aobs; do
            code=$(curl -sk -o body.txt -w '%{http_code}' --path-as-is "https://localhost$path")
            case "$code" in 401|400|404) ;; *) echo "$path: got $code"; exit 1 ;; esac
            if grep -q 'Основная навигация' body.txt; then echo "$path: app page leaked"; exit 1; fi
          done
          # Тело ответа 401 пустое; HEAD и RSC-запросы к приложению тоже закрыты.
          test "$(curl -sk -o body.txt -w '%{http_code}' https://localhost/jobs)" = "401" && test ! -s body.txt
          test "$(curl -sk -I -o /dev/null -w '%{http_code}' https://localhost/jobs)" = "401"
          test "$(curl -sk -I -o /dev/null -w '%{http_code}' https://localhost/)" = "200"
          test "$(curl -sk -o /dev/null -w '%{http_code}' -H 'RSC: 1' https://localhost/jobs)" = "401"
          test "$(curl -sk -o /dev/null -w '%{http_code}' -H 'RSC: 1' -H 'Next-Router-Prefetch: 1' https://localhost/account)" = "401"
          # Главная не содержит данных приложения: ни заказов из демо-сида, ни шапки с сессией.
          curl -sk https://localhost/ > body.txt
          if grep -q -e 'Ремонт однокомнатной квартиры' -e 'Основная навигация' body.txt; then
            echo 'landing contains app data'; exit 1
          fi
          echo 'Proxy checks passed'

      - name: Container logs on failure
        if: failure()
        run: $COMPOSE logs --tail 200

      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v
