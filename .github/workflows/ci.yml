name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agregator
          POSTGRES_PASSWORD: agregator
          POSTGRES_DB: agregator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agregator -d agregator_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Только для эфемерной БД в CI, не секрет.
      DATABASE_URL: postgresql://agregator:agregator@localhost:5432/agregator_test?schema=public
      TEST_DATABASE_URL: postgresql://agregator:agregator@localhost:5432/agregator_test?schema=public
      API_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Migrations and seed apply cleanly
        run: |
          pnpm --filter @agregator/api exec prisma migrate deploy
          pnpm --filter @agregator/api exec tsx prisma/seed.ts
          pnpm --filter @agregator/api exec tsx prisma/seed.ts
