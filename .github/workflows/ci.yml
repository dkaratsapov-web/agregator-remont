name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agregator
          POSTGRES_PASSWORD: agregator
          POSTGRES_DB: agregator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agregator -d agregator_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Только для эфемерной БД в CI, не секрет.
      DATABASE_URL: postgresql://agregator:agregator@localhost:5432/agregator_test?schema=public
      TEST_DATABASE_URL: postgresql://agregator:agregator@localhost:5432/agregator_test?schema=public
      API_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # ADR 0001/0003: спецификация и типы генерируются из кода; ручные правки и забытая
      # перегенерация ломают сборку.
      - name: OpenAPI and generated types are up to date
        run: |
          node apps/api/dist/openapi/generate.js
          pnpm --filter @agregator/shared openapi:types
          git diff --exit-code -- apps/api/openapi.json packages/shared/src/generated

      - name: Migrations and seed apply cleanly
        run: |
          pnpm --filter @agregator/api exec prisma migrate deploy
          pnpm --filter @agregator/api exec tsx prisma/seed.ts
          pnpm --filter @agregator/api exec tsx prisma/seed.ts

      - name: Smoke and integration tests (production build)
        env:
          NODE_ENV: production
          CORS_ORIGINS: https://remont.example
          # Имитация схемы proxy → web → API: web доверяет одному proxy, API доверяет web (loopback).
          TRUST_PROXY: loopback
          WEB_TRUST_PROXY_HOPS: '1'
          WEB_PUBLIC_ORIGIN: http://localhost:3000
          AUTH_RATE_LIMIT_PER_MIN: '3'
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          echo $! > api.pid
          (cd apps/web && pnpm exec next start --port 3000 > ../../web.log 2>&1 &)
          pnpm smoke
          node scripts/jobs-integration.mjs
          node scripts/bids-integration.mjs
          # Последним: в конце останавливает API, чтобы проверить выход при сбое API.
          API_PID=$(cat api.pid) node scripts/auth-integration.mjs

      - name: Server logs on failure
        if: failure()
        run: tail -n 100 api.log web.log || true

  docker:
    name: Docker stack (compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml -f deploy/docker-compose.ci.yml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Prepare deploy/.env
        run: |
          cp deploy/.env.example deploy/.env
          sed -i "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" deploy/.env
          echo "AUTH_RATE_LIMIT_PER_MIN=20" >> deploy/.env

      - name: Build images and start the stack
        run: $COMPOSE up -d --build

      - name: Wait for web
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/offline > /dev/null && exit 0
            sleep 2
          done
          exit 1

      - name: Smoke and integration tests against containers
        env:
          NODE_ENV: production
          API_URL: http://localhost:4000
          WEB_URL: http://localhost:3000
        run: |
          node scripts/smoke.mjs
          node scripts/jobs-integration.mjs
          node scripts/bids-integration.mjs

      - name: Another container in the backend network cannot spoof the client IP
        run: |
          docker run --rm --network agregator_backend agregator-api:local node -e "
            (async () => {
              for (let i = 1; i <= 30; i++) {
                const res = await fetch('http://api:4000/v1/auth/login', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'X-Forwarded-For': '203.0.113.' + i },
                  body: JSON.stringify({ email: 'victim@example.ru', password: 'guess-password-' + i }),
                });
                if (res.status === 429) { console.log('blocked after', i, 'attempts with rotating X-Forwarded-For'); return; }
              }
              console.error('X-Forwarded-For from a non-web container was trusted'); process.exit(1);
            })();"

      - name: Image sizes
        if: always()
        run: docker image ls 'agregator-*'

      - name: Container logs on failure
        if: failure()
        run: $COMPOSE logs --tail 200

      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v

  proxy:
    name: Docker stack behind Caddy (proxy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.proxy.yml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Prepare deploy/.env for https://localhost (Caddy internal CA)
        run: |
          cp deploy/.env.example deploy/.env
          HASH=$(docker run --rm caddy:2-alpine caddy hash-password --plaintext 'ci-password')
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "DOMAIN=localhost"
            echo "PUBLIC_ORIGIN=https://localhost"
            echo "WEB_TRUST_PROXY_HOPS=1"
            echo "BASIC_AUTH_USER=tester"
            echo "BASIC_AUTH_HASH='$HASH'"
          } >> deploy/.env

      - name: Only Caddy publishes ports; backend network is internal
        run: $COMPOSE config --format json | node scripts/check-deploy-ports.mjs

      - name: Build images and start the stack
        run: $COMPOSE up -d --build

      - name: Wait for Caddy
        run: |
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/) || true
            [ "$code" = "401" ] && exit 0
            sleep 2
          done
          exit 1

      - name: Password, HTTPS and closed web port
        run: |
          set -e
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/jobs)" = "401"
          test "$(curl -sk -o /dev/null -w '%{http_code}' -u tester:wrong https://localhost/jobs)" = "401"
          test "$(curl -sk -o /dev/null -w '%{http_code}' -u tester:ci-password https://localhost/jobs)" = "200"
          curl -sk -D - -o /dev/null -u tester:ci-password https://localhost/jobs | grep -i '^strict-transport-security: max-age=31536000'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/jobs)" = "308"
          if curl -s -o /dev/null --max-time 5 http://127.0.0.1:3000/; then echo 'web port 3000 is reachable on the host'; exit 1; fi
          if curl -s -o /dev/null --max-time 5 http://127.0.0.1:4000/health; then echo 'api port 4000 is reachable on the host'; exit 1; fi
          echo 'Proxy checks passed'

      - name: Container logs on failure
        if: failure()
        run: $COMPOSE logs --tail 200

      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v
